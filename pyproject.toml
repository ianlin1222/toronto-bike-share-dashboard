[build-system]
requires = ["hatchling==1.32.0", "pathspec==0.12.1"]
build-backend = "hatchling.build"

[project]
name = "bike-share-dock-availability"
version = "0.2.0"
description = "Point-in-time Bike Share Toronto return-station recommendations"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Bike Share Dock Availability Predictor contributors" }]
dependencies = [
  "alembic>=1.19,<1.20",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<0.29",
  "joblib>=1.6,<1.7",
  "numpy>=2.5,<2.6",
  "pandas>=3.0,<3.1",
  "pyarrow>=23,<24",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.15,<2.16",
  "scikit-learn>=1.9,<1.10",
  "sqlalchemy>=2.0,<2.1",
  "tenacity>=9.1,<9.2",
  "uvicorn[standard]>=0.52,<0.53",
]

[project.scripts]
bikeshare = "bikeshare.cli:main"
bikeshare-api = "bikeshare.api.main:run"

[dependency-groups]
dev = [
  "mypy>=2.3,<2.4",
  "pytest>=9.1,<9.2",
  "pytest-asyncio>=1.4,<1.5",
  "pytest-cov>=7.0,<8",
  "ruff>=0.16,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bikeshare"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a disposable PostgreSQL database",
  "live: performs an opt-in request to the public Toronto GBFS service",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".uv-cache", ".venv", "var"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["bikeshare"]

[[tool.mypy.overrides]]
module = ["joblib", "pandas", "pyarrow", "pyarrow.*", "sklearn.*"]
ignore_missing_imports = true
